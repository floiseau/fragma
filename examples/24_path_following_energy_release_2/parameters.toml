[model]
name = "fracture"
dim = 2
2D_assumption = "plane_strain"
model = "AT1"

[mesh]
msh_file = "mesh.msh"

[mesh.physical_groups]
bot = 11
top = 12
non-crackable_1 = 11
non-crackable_2 = 12

[numerical]
utol = 1e-9
atol = 1e-6
max_iter = 100_000
alpha_res = 1e-12

[mechanical]
E = 230.77e9
nu = 0.43
Gc = 2.7e3
ell = 0.015e-3

[[initial_crack]]
p1 = [0, 5e-4, 0]
p2 = [5e-4, 5e-4, 0]
width = 3.75e-06

[loading]
dl = 0.01
constraint = "energy_release_2"
dtau = 0.005
beta = 1e-4

[loading.nodal_displacement]
lock_point.x = [0, 0, 0]
lock_point.u = [0, 0]

[loading.u_imp_max]
bot = [nan, 0]
top = [nan, 0.006e-3]

[end]
criterion = "elastic_energy_drop"
drop = 0.002

[postprocess]
reaction_forces = ["bot", "top"]
[postprocess.probes]
displacement= [
    [0, 1e-3, 0],
    [0.5e-3, 0.49e-3, 0],
    [0.5e-3, 0.51e-3, 0],
]

