[model]
name = "fracture"
dim = 2
2D_assumption = "plane_strain"
model = "AT1"

[mesh]
msh_file = "mesh.msh"

[mesh.physical_groups]
bot_pin = 2
top_pin = 3
crack = 4
non-crackable_1 = 2
non-crackable_2 = 3

[numerical]
utol = 1e-9
atol = 1e-5
max_iter = 100_000
alpha_res = 1e-12
# omega = 1.5

[mechanical]
# Elasticity
E = 200e9
nu = 0.29
# Fracture
Gc = 4000
ell = 1e-3

[loading]
constraint = "max_strain_inc"
dtau = 2e-2 # 1e-2
dl = 1e-2
[loading.u_imp_max]
top_pin = [0, 0]
[loading.f_imp_max]
bot_pin = [0, -1e8]

[end]
criterion = "t"
t_max = 100

[postprocess]
reaction_forces = ["bot_pin", "top_pin"]

[postprocess.probes]
displacement= [
    [0, 0.02115, 0],
    [0, 0.01700, 0],
]
