[model]
name = "fracture"
dim = 2
2D_assumption = "plane_strain"
model = "AT1"

[mesh]
msh_file = "mesh.msh"

[mesh.physical_groups]
bot = 11
top = 12
crack = 13

[numerical]
utol = 1e-9
atol = 1e-6
max_iter = 100_000
alpha_res = 1e-12

[mechanical]
E = 230.77e9
nu = 0.43
Gc = 2.7e3
ell = 0.015e-3

[loading]
constraint = "max_strain_inc"
dl = 1e-2
dtau = 2e-3
k_opt = 24
[loading.nodal_displacement]
origin.x = [0, 0, 0]
origin.u = [0, 0]
[loading.u_imp_max]
bot = [nan, 0]
top = [nan, 0.006e-3]

[end]
criterion = "elastic_energy_drop"
drop = 0.002

[postprocess]
reaction_forces = ["bot", "top"]
[postprocess.probes]
displacement= [
    [0, 1e-3, 0],
    [0.5e-3, 0.49e-3, 0],
    [0.5e-3, 0.51e-3, 0],
]

