[model]
name = "fracture"
dim = 2
2D_assumption = "plane_strain"
model = "Foc4-Foc4"

[mesh]
msh_file = "mesh.msh"

[mesh.physical_groups]
bot = 2
top = 3
non-crackable_1 = 2
non-crackable_2 = 3
crack = 4

[numerical]
nl_solver = "tao" # Using a TAO solver from PETSc (SNES does not converge)
utol = 1e-9
atol = 1e-6
max_iter = 100_000
alpha_res = 1e-12

[mechanical]
E = 1
nu = 0.3
# Parameters of the Foc4 model
ell = 0.1
Gc = 1
D2 = 1.35
P2 = 1.5707963267948966 # pi/2
D4 = 0.389711431702998
P4 = 0.0

[loading]
dl = 0.01

[loading.nodal_displacement]
lock_point.x = [0, 0, 0]
lock_point.u = [0, 0]

[loading.u_imp_max]
bot = [nan, 0]
top = [nan, 1]

[end]
criterion = "elastic_energy_drop"
drop = 0.01

[postprocess]
reaction_forces = ["bot", "top"]
[postprocess.probes]
displacement= [
    [0, 0, 0],
    [0, 1, 0],
]

