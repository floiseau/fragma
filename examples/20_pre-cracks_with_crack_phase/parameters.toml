[model]
name = "fracture"
dim = 2
2D_assumption = "plane_strain"
model = "AT1"

[mesh]
msh_file = "mesh.msh"

[mesh.physical_groups]
bot = 11
top = 12

[numerical]
utol = 1e-6
atol = 1e-5
max_iter = 100_000
alpha_res = 1e-12

[mechanical]
E = 230.77e9
nu = 0.43
Gc = 2.7e3
ell = 0.02

[[initial_crack]]
p1 = [0, 0.5, 0]
p2 = [0.25, 0.5, 0]
width = 0.004

[[initial_crack]]
p1 = [0.75, 0.5, 0]
p2 = [1, 0.5, 0]
width = 0.004

[loading]
dl = 0.01
[loading.nodal_displacement]
lock_point.x = [0, 0, 0]
lock_point.u = [0, 0]
[loading.u_imp_max]
bot = [nan, 0]
top = [nan, 1e-4]

[end]
criterion = "elastic_energy_drop"
drop = 0.002

[postprocess]
reaction_forces = ["bot", "top"]
[postprocess.probes]
displacement= [
    [0, 1e-3, 0],
    [0.5e-3, 0.49e-3, 0],
    [0.5e-3, 0.51e-3, 0],
]

